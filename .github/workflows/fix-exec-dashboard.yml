name: Repair executive dashboard build

on:
  push:
    branches:
      - fix/executive-dashboard-build

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove undefined Empty component usage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/admin/Phase1Dashboard.js')
          s = p.read_text()
          old = '{!programmeBreakdown.length && <Empty text="No approved programme data."/>}'
          new = '{!programmeBreakdown.length && <div className="empty">No approved programme data.</div>}'
          if old not in s:
              raise SystemExit('Expected dashboard fragment was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/Phase1Dashboard.js
          git commit -m "fix: define empty programme state inline"
          git push
